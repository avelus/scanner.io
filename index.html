<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bybit Heatmap</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    margin:20px;
}

#heatmap{
    width:100%;
    height:700px;
    border:1px solid #333;
}

.panel{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    min-width:250px;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

</style>
</head>
<body>

<h1>BTCUSDT Order Book Heatmap</h1>

<div class="panel">

<div class="card">
    <h3>Imbalance</h3>
    <div id="imbalance">-</div>
</div>

<div class="card">
    <h3>Največji Buy Wall</h3>
    <div id="buyWall">-</div>
</div>

<div class="card">
    <h3>Največji Sell Wall</h3>
    <div id="sellWall">-</div>
</div>

</div>

<canvas id="heatmap"></canvas>

<script>

const canvas =
    document.getElementById("heatmap");

const ctx =
    canvas.getContext("2d");

canvas.width =
    window.innerWidth - 50;

canvas.height = 700;

let history = [];

async function loadBook(){

    const url =
'https://api.bybit.com/v5/market/orderbook?category=linear&symbol=BTCUSDT&limit=200';

    const r = await fetch(url);

    const json =
        await r.json();

    const bids =
        json.result.b;

    const asks =
        json.result.a;

    process(bids,asks);

}

function process(bids,asks){

    const bidVolume =
        bids.reduce(
           (a,b)=>a+Number(b[1]),0
        );

    const askVolume =
        asks.reduce(
           (a,b)=>a+Number(b[1]),0
        );

    const imbalance =
        (
         (bidVolume-askVolume)
         /(bidVolume+askVolume)
        )*100;

    document
      .getElementById("imbalance")
      .innerHTML =
      imbalance.toFixed(2)+" %";

    const biggestBid =
        bids.reduce(
         (a,b)=>
          Number(a[1])>Number(b[1])
          ?a:b
        );

    const biggestAsk =
        asks.reduce(
         (a,b)=>
          Number(a[1])>Number(b[1])
          ?a:b
        );

    document
    .getElementById("buyWall")
    .innerHTML =
    biggestBid[0]
    +" | "
    +biggestBid[1];

    document
    .getElementById("sellWall")
    .innerHTML =
    biggestAsk[0]
    +" | "
    +biggestAsk[1];

    history.push({
        bids,
        asks
    });

    if(history.length > 250){
        history.shift();
    }

    draw();

}

function draw(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const colWidth = 4;

    history.forEach((snapshot,x)=>{

        const all =
        [
          ...snapshot.bids,
          ...snapshot.asks
        ];

        const maxSize =
        Math.max(
          ...all.map(a=>Number(a[1]))
        );

        snapshot.bids.forEach((row,i)=>{

            const size =
                Number(row[1]);

            const alpha =
                size/maxSize;

            ctx.fillStyle =
                `rgba(0,255,0,${alpha})`;

            ctx.fillRect(
                x*colWidth,
                canvas.height-(i*3),
                colWidth,
                3
            );

        });

        snapshot.asks.forEach((row,i)=>{

            const size =
                Number(row[1]);

            const alpha =
                size/maxSize;

            ctx.fillStyle =
                `rgba(255,0,0,${alpha})`;

            ctx.fillRect(
                x*colWidth,
                i*3,
                colWidth,
                3
            );

        });

    });

}

loadBook();

setInterval(loadBook,3000);

</script>

</body>
</html>
