<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Liquidity Scanner</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

.card{
    background:#1f2937;
    border-radius:10px;
    padding:15px;
    margin:10px 0;
}

.green{
    color:#22c55e;
}

.yellow{
    color:#facc15;
}

.red{
    color:#ef4444;
}
</style>
</head>
<body>

<h1>Bybit Energy Scanner</h1>

<button onclick="loadData()">Osveži podatke</button>

<p id="status"></p>

<h2>TOP 3 kovanci</h2>
<div id="top3"></div>

<h2>Vsi kovanci</h2>
<div id="results"></div>

<script>

const COINS = [
"BTCUSDT",
"ETHUSDT",
"SOLUSDT",
"ADAUSDT",
"SUIUSDT",
"XRPUSDT",
"DOGEUSDT",
"LINKUSDT",
"AVAXUSDT"
];

function ema(values, period){

    const k = 2 / (period + 1);

    let result = [];

    values.forEach((v,i)=>{

        if(i===0){
            result.push(v);
        }else{
            result.push(
                v*k + result[i-1]*(1-k)
            );
        }

    });

    return result;
}

function sma(values, period){

    let result = [];

    for(let i=0;i<values.length;i++){

        if(i<period-1){
            result.push(values[i]);
        }else{

            const slice =
                values.slice(i-period+1,i+1);

            const avg =
                slice.reduce((a,b)=>a+b,0)/period;

            result.push(avg);
        }
    }

    return result;
}

function calculateEnergy(closes){

    const ema1 = ema(closes,9);

    const sma1 = sma(ema1,6);

    const diff =
        ema1.map((v,i)=>
            (v-sma1[i])*2+50
        );

    const energy =
        ema(diff,3);

    return energy[energy.length-1];
}

function energyColor(val){

    if(val > 60)
        return "green";

    if(val > 50)
        return "yellow";

    return "red";
}

async function fetchCoin(symbol){

    try{

        const url =
        `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=60&limit=100`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        const closes =
            data.result.list
                .map(x=>parseFloat(x[4]))
                .reverse();

        const energy =
            calculateEnergy(closes);

        return {
            symbol,
            energy
        };

    }catch(e){

        console.error(symbol,e);

        return {
            symbol,
            energy:0
        };
    }
}

async function loadData(){

    document.getElementById("status").innerText =
        "Nalaganje...";

    const results =
        await Promise.all(
            COINS.map(fetchCoin)
        );

    results.sort(
        (a,b)=>b.energy-a.energy
    );

    const top3 =
        results.slice(0,3);

    document.getElementById("top3").innerHTML =
        top3.map(c=>`
            <div class="card">
                <h3>${c.symbol}</h3>
                <p class="${energyColor(c.energy)}">
                    Energy:
                    ${c.energy.toFixed(2)}
                </p>
            </div>
        `).join("");

    document.getElementById("results").innerHTML =
        results.map(c=>`
            <div class="card">
                <strong>${c.symbol}</strong>
                <div class="${energyColor(c.energy)}">
                    Energy:
                    ${c.energy.toFixed(2)}
                </div>
            </div>
        `).join("");

    document.getElementById("status").innerText =
        "Posodobljeno: "
        + new Date().toLocaleTimeString();
}

loadData();

setInterval(loadData,1800000);

</script>

</body>
</html>
