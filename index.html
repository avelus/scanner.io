<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Profile Scanner</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    margin:20px;
}

select,button{
    padding:8px;
    margin:5px;
}

canvas{
    background:#111827;
    border:1px solid #333;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #334155;
    padding:8px;
    text-align:center;
}

th{
    background:#1e293b;
}

.green{
    color:#22c55e;
    font-weight:bold;
}

.red{
    color:#ef4444;
    font-weight:bold;
}

</style>
</head>
<body>

<h1>Volume Profile Scanner</h1>

<select id="symbol">
    <option>BTCUSDT</option>
    <option>ETHUSDT</option>
    <option>SOLUSDT</option>
    <option>ADAUSDT</option>
    <option>XRPUSDT</option>
    <option>SUIUSDT</option>
</select>

<button onclick="runAnalysis()">
Analiziraj
</button>

<table id="results">
<thead>
<tr>
<th>Period</th>
<th>POC</th>
<th>Buy Zone</th>
<th>Sell Zone</th>
<th>VA Low</th>
<th>VA High</th>
</tr>
</thead>
<tbody></tbody>
</table>

<canvas id="heatmap" width="1200" height="700"></canvas>

<script>

const periods = [
    {name:"1D",days:1},
    {name:"3D",days:3},
    {name:"1W",days:7},
    {name:"2W",days:14},
    {name:"1M",days:30},
    {name:"3M",days:90},
    {name:"6M",days:180}
];

async function loadCandles(symbol,days){

    let limit = Math.min(days*24,1000);

    const url =
      `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=60&limit=${limit}`;

    const response = await fetch(url);
    const json = await response.json();

    return json.result.list.reverse();

}

function buildProfile(candles){

    let prices = [];

    candles.forEach(c=>{

        const high = Number(c[2]);
        const low = Number(c[3]);
        const volume = Number(c[5]);

        const mid = (high+low)/2;

        prices.push({
            price:mid,
            volume:volume
        });

    });

    const min =
      Math.min(...prices.map(x=>x.price));

    const max =
      Math.max(...prices.map(x=>x.price));

    const bins = 50;

    const size =
      (max-min)/bins;

    let profile = [];

    for(let i=0;i<bins;i++){

        profile.push({
            price:min+(i*size),
            volume:0
        });

    }

    prices.forEach(p=>{

        const idx =
          Math.min(
            bins-1,
            Math.floor((p.price-min)/size)
          );

        profile[idx].volume += p.volume;

    });

    return profile;

}

function calculateLevels(profile){

    const sorted =
       [...profile]
       .sort((a,b)=>b.volume-a.volume);

    const poc = sorted[0];

    const total =
      profile.reduce((s,p)=>s+p.volume,0);

    const target = total*0.70;

    let cumulative = 0;
    let selected = [];

    for(let row of sorted){

        cumulative += row.volume;
        selected.push(row);

        if(cumulative >= target)
            break;
    }

    const prices =
      selected.map(x=>x.price);

    const val =
      Math.min(...prices);

    const vah =
      Math.max(...prices);

    return {

        poc:poc.price,

        buyZone:val,

        sellZone:vah,

        val:val,

        vah:vah

    };

}

function drawHeatmap(profile){

    const canvas =
      document.getElementById("heatmap");

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
       0,
       0,
       canvas.width,
       canvas.height
    );

    const maxVol =
      Math.max(...profile.map(x=>x.volume));

    const barHeight =
      canvas.height/profile.length;

    profile.forEach((row,i)=>{

        const strength =
           row.volume/maxVol;

        ctx.fillStyle =
           `rgba(0,255,0,${strength})`;

        ctx.fillRect(
            0,
            canvas.height-(i*barHeight),
            canvas.width*strength,
            barHeight-1
        );

        ctx.fillStyle = "white";

        ctx.fillText(
            row.price.toFixed(2),
            10,
            canvas.height-(i*barHeight)
        );

    });

}

async function runAnalysis(){

    const symbol =
      document.getElementById("symbol").value;

    const tbody =
      document.querySelector("#results tbody");

    tbody.innerHTML = "";

    let lastProfile = [];

    for(const p of periods){

        try{

            const candles =
              await loadCandles(
                symbol,
                p.days
              );

            const profile =
              buildProfile(candles);

            const levels =
              calculateLevels(profile);

            lastProfile = profile;

            tbody.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${levels.poc.toFixed(2)}</td>
                <td class="green">
                   ${levels.buyZone.toFixed(2)}
                </td>
                <td class="red">
                   ${levels.sellZone.toFixed(2)}
                </td>
                <td>
                   ${levels.val.toFixed(2)}
                </td>
                <td>
                   ${levels.vah.toFixed(2)}
                </td>
            </tr>`;

        }
        catch(e){

            console.error(e);

        }

    }

    drawHeatmap(lastProfile);

}

runAnalysis();

</script>

</body>
</html>
