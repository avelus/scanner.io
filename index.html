<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Scanner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    padding: 20px;
}

.card {
    background: #1f2937;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
}

button {
    padding: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Bybit Liquidity Scanner</h1>

<button onclick="loadData()">Osveži</button>

<div id="results"></div>

<script>

const MAJOR_COINS = [
    "BTCUSDT",
    "ETHUSDT",
    "SOLUSDT",
    "ADAUSDT",
    "SUIUSDT"
];

// EMA
function ema(values, period) {

    const k = 2 / (period + 1);
    let result = [];

    values.forEach((v, i) => {
        if (i === 0) {
            result.push(v);
        } else {
            result.push(v * k + result[i - 1] * (1 - k));
        }
    });

    return result;
}

// SMA
function sma(values, period) {

    const result = [];

    for (let i = 0; i < values.length; i++) {

        if (i < period - 1) {
            result.push(values[i]);
        } else {

            const slice = values.slice(i - period + 1, i + 1);

            const avg =
                slice.reduce((a, b) => a + b, 0) / period;

            result.push(avg);
        }
    }

    return result;
}

// Energy indikator
function calculateEnergy(closes) {

    const ema1 = ema(closes, 9);
    const sma1 = sma(ema1, 6);

    const diff = ema1.map((v, i) =>
        (v - sma1[i]) * 2 + 50
    );

    const energy = ema(diff, 3);

    return energy[energy.length - 1];
}

// Demo podatki
function loadData() {

    const results = document.getElementById("results");

    results.innerHTML = "";

    MAJOR_COINS.forEach(symbol => {

        const closes = [];

        for (let i = 0; i < 100; i++) {
            closes.push(
                100 + Math.random() * 20
            );
        }

        const energy =
            calculateEnergy(closes).toFixed(2);

        results.innerHTML += `
            <div class="card">
                <h3>${symbol}</h3>
                <p>Energy: ${energy}</p>
            </div>
        `;
    });
}

loadData();

</script>

</body>
</html>
