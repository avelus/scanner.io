<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Institutional Confluence Scanner</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    margin:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

canvas{
    background:#111827;
    border:1px solid #334155;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

.yellow{
    color:#facc15;
}

</style>
</head>
<body>

<h1>BTCUSDT Institutional Scanner</h1>

<div class="card">

<h3>Analiza</h3>

<p>
Current Price:
<span id="price" class="yellow"></span>
</p>

<p>
Buy Zone:
<span id="buyzone" class="green"></span>
</p>

<p>
Sell Zone:
<span id="sellzone" class="red"></span>
</p>

<p>
Buy Strength:
<span id="buystrength"></span>
</p>

<p>
Sell Strength:
<span id="sellstrength"></span>
</p>

<p>
Risk/Reward:
<span id="rr"></span>
</p>

</div>

<canvas id="chart" width="1200" height="800"></canvas>

<script>

const currentPrice = 114850;

const buyZone = {
    low:110000,
    high:111200,
    strength:96,
    tf:["1D","3D","1W","2W","1M"]
};

const sellZone = {
    low:124500,
    high:126000,
    strength:91,
    tf:["1W","2W","1M","3M"]
};

document.getElementById("price").innerText =
    currentPrice;

document.getElementById("buyzone").innerText =
    buyZone.low + " - " + buyZone.high;

document.getElementById("sellzone").innerText =
    sellZone.low + " - " + sellZone.high;

document.getElementById("buystrength").innerText =
    buyZone.strength + "/100";

document.getElementById("sellstrength").innerText =
    sellZone.strength + "/100";

const risk =
    ((currentPrice-buyZone.high)/currentPrice*100);

const reward =
    ((sellZone.low-currentPrice)/currentPrice*100);

document.getElementById("rr").innerText =
    "Risk " +
    risk.toFixed(2) +
    "% | Reward " +
    reward.toFixed(2) +
    "%";

const canvas =
    document.getElementById("chart");

const ctx =
    canvas.getContext("2d");

const chartTop = 50;
const chartBottom = 750;

const maxPrice = 130000;
const minPrice = 100000;

function mapPrice(price){

    return chartBottom -
           ((price-minPrice)
           /(maxPrice-minPrice))
           *(chartBottom-chartTop);
}

function drawPriceScale(){

    ctx.strokeStyle="#334155";

    for(let p=minPrice;p<=maxPrice;p+=2000){

        const y=mapPrice(p);

        ctx.beginPath();
        ctx.moveTo(100,y);
        ctx.lineTo(1100,y);
        ctx.stroke();

        ctx.fillStyle="white";
        ctx.fillText(p,20,y+5);
    }
}

function drawZone(zone,color,label){

    const y1=mapPrice(zone.high);
    const y2=mapPrice(zone.low);

    ctx.fillStyle=color;

    ctx.fillRect(
        150,
        y1,
        850,
        y2-y1
    );

    ctx.fillStyle="white";

    ctx.font="16px Arial";

    ctx.fillText(
        label +
        " Strength "
        + zone.strength,
        180,
        (y1+y2)/2
    );

    ctx.fillText(
        zone.tf.join(", "),
        180,
        ((y1+y2)/2)+20
    );
}

function drawCurrentPrice(){

    const y=mapPrice(currentPrice);

    ctx.strokeStyle="yellow";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(100,y);
    ctx.lineTo(1100,y);
    ctx.stroke();

    ctx.fillStyle="yellow";

    ctx.fillText(
        "CURRENT PRICE "
        + currentPrice,
        920,
        y-10
    );
}

drawPriceScale();

drawZone(
    buyZone,
    "rgba(34,197,94,0.35)",
    "BUY ZONE"
);

drawZone(
    sellZone,
    "rgba(239,68,68,0.35)",
    "SELL ZONE"
);

drawCurrentPrice();

</script>

</body>
</html>
