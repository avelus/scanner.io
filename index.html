<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Liquidity Confluence Tracker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f1115;
color:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

button{
background:#2563eb;
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.card{
background:#171923;
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.coin-card{
background:#171923;
border-radius:12px;
padding:20px;
}

.section-title{
font-size:22px;
font-weight:bold;
margin-bottom:15px;
}

.sub-title{
font-size:18px;
margin-bottom:10px;
color:#60a5fa;
}

.level{
padding:4px 0;
}

.strong{
color:#22c55e;
font-weight:bold;
}

.top-row{
display:flex;
justify-content:space-between;
padding:10px;
background:#202432;
border-radius:8px;
margin-bottom:8px;
}

.tolerance{
display:flex;
gap:12px;
align-items:center;
margin-bottom:20px;
}

input[type=range]{
width:250px;
}

.price{
color:#fbbf24;
font-weight:bold;
}

.rank{
font-weight:bold;
color:#22c55e;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.top-row{
flex-direction:column;
gap:5px;
}

}

</style>
</head>
<body>

<div class="header">
<h1>Crypto Liquidity Confluence Tracker</h1>
<button onclick="refreshData()">Refresh</button>
</div>

<div class="tolerance card">
<label>Strong Level Tolerance:</label>
<input
type="range"
min="0.1"
max="2"
step="0.1"
value="0.5"
id="tolerance"
/>
<span id="tolValue">0.5%</span>
</div>

<div class="card">
<h2 class="section-title">
TOP OPPORTUNITIES
</h2>

<div id="ranking"></div>
</div>

<div id="coinsContainer" class="grid"></div>

<script>

/******************************************************************
CONFIG
******************************************************************/

const COINS = [
"BTCUSDT",
"ETHUSDT",
"SOLUSDT",
"ADAUSDT",
"XRPUSDT"
];

const REFRESH_INTERVAL = 300000;

/******************************************************************
DATA PROVIDER
******************************************************************/

class DataProvider {

async getCurrentPrice(symbol){

const basePrices = {
BTCUSDT:118250,
ETHUSDT:3900,
SOLUSDT:180,
ADAUSDT:0.92,
XRPUSDT:1.20
};

return basePrices[symbol];
}

async getHeatmap(symbol, period){

const price = await this.getCurrentPrice(symbol);

const arr = [];

for(let i=0;i<20;i++){

const distance =
(Math.random()*10)+1;

const direction =
Math.random() > 0.5 ? 1 : -1;

const levelPrice =
price +
(price * distance / 100 * direction);

arr.push({
price:Number(levelPrice.toFixed(2)),
liquidity:Math.floor(
Math.random()*10000000
)
});

}

return arr;
}

}

/******************************************************************
LIQUIDITY ANALYZER
******************************************************************/

class LiquidityAnalyzer {

extractTopLevels(
levels,
currentPrice
){

const above =
levels
.filter(x=>x.price > currentPrice)
.sort((a,b)=>b.liquidity-a.liquidity)
.slice(0,3);

const below =
levels
.filter(x=>x.price < currentPrice)
.sort((a,b)=>b.liquidity-a.liquidity)
.slice(0,3);

return {
above,
below
};

}

}

/******************************************************************
CONFLUENCE ANALYZER
******************************************************************/

class ConfluenceAnalyzer {

constructor(tolerance){

this.tolerance=tolerance;
}

withinTolerance(a,b){

const diff =
Math.abs(a-b) /
((a+b)/2)
*100;

return diff <= this.tolerance;
}

findLevels(levels1D,levels2D){

const result = {
above:[],
below:[]
};

for(const a of levels1D.above){

for(const b of levels2D.above){

if(
this.withinTolerance(
a.price,
b.price
)
){

result.above.push({
price:(
(a.price+b.price)/2
).toFixed(2)
});

}

}

}

for(const a of levels1D.below){

for(const b of levels2D.below){

if(
this.withinTolerance(
a.price,
b.price
)
){

result.below.push({
price:(
(a.price+b.price)/2
).toFixed(2)
});

}

}

}

return result;
}

}

/******************************************************************
RANKING ENGINE
******************************************************************/

class RankingEngine {

build(coins){

return coins
.map(c=>{

const all = [
...c.strongLevels.above,
...c.strongLevels.below
];

if(all.length===0){

return {
symbol:c.symbol,
price:c.currentPrice,
distancePct:0,
distanceAbs:0
};

}

let nearest = all[0];

let bestDist =
Math.abs(
nearest.price -
c.currentPrice
);

for(const s of all){

const d =
Math.abs(
s.price -
c.currentPrice
);

if(d < bestDist){

bestDist = d;
nearest = s;

}

}

return {

symbol:c.symbol,

price:c.currentPrice,

distanceAbs:
bestDist.toFixed(2),

distancePct:
(
bestDist /
c.currentPrice *100
).toFixed(2)

};

})
.sort(
(a,b)=>
b.distancePct -
a.distancePct
);

}

}

/******************************************************************
UI RENDERER
******************************************************************/

class UIRenderer {

renderRanking(data){

const root =
document.getElementById(
"ranking"
);

root.innerHTML="";

data.forEach(
(item,index)=>{

root.innerHTML += `
<div class="top-row">
<div class="rank">
${index+1}. ${item.symbol}
</div>

<div>
Price:
${item.price}
</div>

<div>
Distance:
${item.distanceAbs}
</div>

<div>
${item.distancePct}%
</div>
</div>
`;

});
}

renderCoins(result){

const root =
document.getElementById(
"coinsContainer"
);

root.innerHTML="";

result.forEach(c=>{

root.innerHTML += `
<div class="coin-card">

<h2>
${c.symbol}
</h2>

<br>

<div class="price">
Current Price:
${c.currentPrice}
</div>

<br>

<div class="sub-title">
1D
</div>

<b>Above</b>

${c.oneD.above.map(
x=>`
<div class="level">
${x.price}
 | Liquidity:
${x.liquidity.toLocaleString()}
</div>`
).join("")}

<br>

<b>Below</b>

${c.oneD.below.map(
x=>`
<div class="level">
${x.price}
 | Liquidity:
${x.liquidity.toLocaleString()}
</div>`
).join("")}

<hr style="margin:15px 0">

<div class="sub-title">
2D
</div>

<b>Above</b>

${c.twoD.above.map(
x=>`
<div class="level">
${x.price}
 | Liquidity:
${x.liquidity.toLocaleString()}
</div>`
).join("")}

<br>

<b>Below</b>

${c.twoD.below.map(
x=>`
<div class="level">
${x.price}
 | Liquidity:
${x.liquidity.toLocaleString()}
</div>`
).join("")}

<hr style="margin:15px 0">

<div class="strong">
STRONG LEVELS
</div>

<br>

<b>Above</b>

${c.strongLevels.above.map(
x=>`
<div>
${x.price}
</div>
`
).join("")}

<br>

<b>Below</b>

${c.strongLevels.below.map(
x=>`
<div>
${x.price}
</div>
`
).join("")}

</div>
`;

});

}

}

/******************************************************************
APP
******************************************************************/

const provider =
new DataProvider();

const liquidityAnalyzer =
new LiquidityAnalyzer();

const renderer =
new UIRenderer();

async function refreshData(){

const tolerance =
Number(
document.getElementById(
"tolerance"
).value
);

const confluenceAnalyzer =
new ConfluenceAnalyzer(
tolerance
);

const allCoins = [];

for(const symbol of COINS){

const currentPrice =
await provider.getCurrentPrice(
symbol
);

const heatmap1D =
await provider.getHeatmap(
symbol,
"1D"
);

const heatmap2D =
await provider.getHeatmap(
symbol,
"2D"
);

const oneD =
liquidityAnalyzer
.extractTopLevels(
heatmap1D,
currentPrice
);

const twoD =
liquidityAnalyzer
.extractTopLevels(
heatmap2D,
currentPrice
);

const strongLevels =
confluenceAnalyzer
.findLevels(
oneD,
twoD
);

allCoins.push({

symbol,

currentPrice,

oneD,

twoD,

strongLevels

});

}

const ranking =
new RankingEngine()
.build(allCoins);

renderer.renderRanking(
ranking
);

renderer.renderCoins(
allCoins
);

}

document
.getElementById(
"tolerance"
)
.addEventListener(
"input",
e=>{

document.getElementById(
"tolValue"
).innerText =
e.target.value + "%";

refreshData();

}
);

refreshData();

setInterval(
refreshData,
REFRESH_INTERVAL
);

</script>

</body>
</html>
