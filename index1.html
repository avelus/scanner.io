<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquidity Confluence Tracker</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.card{
    background:#161b22;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
    gap:20px;
}

.coin-card{
    background:#161b22;
    border-radius:12px;
    padding:20px;
}

.price{
    color:#fbbf24;
    font-size:18px;
    font-weight:bold;
}

.strong{
    color:#22c55e;
    font-weight:bold;
}

.level{
    padding:3px 0;
}

.rank-row{
    display:flex;
    justify-content:space-between;
    padding:10px;
    margin-bottom:8px;
    border-radius:8px;
    background:#21262d;
    flex-wrap:wrap;
}

h2,h3{
    margin-top:0;
}

input[type=range]{
    width:250px;
}

.section{
    margin-top:15px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .rank-row{
        flex-direction:column;
        gap:5px;
    }
}

</style>
</head>
<body>

<div class="header">

    <h1>Crypto Liquidity Confluence Tracker</h1>

    <button onclick="loadData()">
        Refresh
    </button>

</div>

<div class="card">

    <label>
        Strong Level Tolerance:
        <span id="tolText">0.5%</span>
    </label>

    <br><br>

    <input
        id="tolerance"
        type="range"
        min="0.1"
        max="2"
        value="0.5"
        step="0.1"
    >

</div>

<div class="card">

    <h2>TOP OPPORTUNITIES</h2>

    <div id="ranking"></div>

</div>

<div
    id="coins"
    class="grid"
></div>

<script>

const COINS = [
    "BTCUSDT",
    "ETHUSDT",
    "SOLUSDT",
    "ADAUSDT",
    "XRPUSDT"
];

class BinanceProvider {

    async getCurrentPrice(symbol){

        const r = await fetch(
            `https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`
        );

        const data = await r.json();

        return Number(data.price);
    }
}

class BybitProvider {

    async getCurrentPrice(symbol){

        try{

            const r = await fetch(
                `https://api.bybit.com/v5/market/tickers?category=linear&symbol=${symbol}`
            );

            const data = await r.json();

            return Number(
                data.result.list[0].lastPrice
            );

        }catch(err){

            return null;
        }
    }
}

class AggregatedProvider {

    constructor(){

        this.binance =
            new BinanceProvider();

        this.bybit =
            new BybitProvider();
    }

    async getCurrentPrice(symbol){

        const binance =
            await this.binance
            .getCurrentPrice(symbol);

        const bybit =
            await this.bybit
            .getCurrentPrice(symbol);

        if(bybit){

            return Number(
                (
                    (binance+bybit)/2
                ).toFixed(6)
            );
        }

        return binance;
    }
}

class HeatmapProvider {

    async getHeatmap(currentPrice){

        const levels = [];

        for(let i=0;i<25;i++){

            const percent =
                (Math.random()*10)+1;

            const direction =
                Math.random() > 0.5 ? 1 : -1;

            const price =
                currentPrice +
                (
                    currentPrice *
                    percent /100 *
                    direction
                );

            levels.push({

                price:
                    Number(
                        price.toFixed(4)
                    ),

                liquidity:
                    Math.floor(
                        Math.random()*10000000
                    )

            });

        }

        return levels;
    }
}

class LiquidityAnalyzer {

    extract(levels,currentPrice){

        return {

            above:

            levels
            .filter(
                x =>
                x.price > currentPrice
            )
            .sort(
                (a,b)=>
                b.liquidity-a.liquidity
            )
            .slice(0,3),

            below:

            levels
            .filter(
                x =>
                x.price < currentPrice
            )
            .sort(
                (a,b)=>
                b.liquidity-a.liquidity
            )
            .slice(0,3)

        };
    }
}

class ConfluenceAnalyzer {

    constructor(tolerance){

        this.tolerance = tolerance;
    }

    isMatch(a,b){

        const diff =

            Math.abs(a-b)
            /
            ((a+b)/2)
            *100;

        return diff <= this.tolerance;
    }

    find(oneD,twoD){

        const result = {

            above:[],
            below:[]
        };

        for(const a of oneD.above){

            for(const b of twoD.above){

                if(
                    this.isMatch(
                        a.price,
                        b.price
                    )
                ){

                    result.above.push({

                        price:
                        (
                            (a.price+b.price)
                            /2
                        ).toFixed(2)

                    });
                }
            }
        }

        for(const a of oneD.below){

            for(const b of twoD.below){

                if(
                    this.isMatch(
                        a.price,
                        b.price
                    )
                ){

                    result.below.push({

                        price:
                        (
                            (a.price+b.price)
                            /2
                        ).toFixed(2)

                    });
                }
            }
        }

        return result;
    }
}

class RankingEngine {

    build(coins){

        return coins.map(c=>{

            const levels = [

                ...c.strong.above,
                ...c.strong.below
            ];

            if(levels.length===0){

                return {

                    symbol:c.symbol,
                    distancePct:0,
                    distanceAbs:0,
                    price:c.price

                };
            }

            let nearest =
                Infinity;

            for(const level of levels){

                const d =
                    Math.abs(
                        Number(level.price)
                        -
                        c.price
                    );

                nearest =
                    Math.min(
                        nearest,
                        d
                    );
            }

            return {

                symbol:c.symbol,

                price:c.price,

                distanceAbs:
                nearest.toFixed(4),

                distancePct:
                (
                    nearest /
                    c.price *
                    100
                ).toFixed(2)

            };

        }).sort(
            (a,b)=>
            b.distancePct -
            a.distancePct
        );
    }
}

const provider =
    new AggregatedProvider();

const heatmapProvider =
    new HeatmapProvider();

const analyzer =
    new LiquidityAnalyzer();

async function loadData(){

    const tolerance =
        Number(
            document
            .getElementById(
                "tolerance"
            ).value
        );

    const confluence =
        new ConfluenceAnalyzer(
            tolerance
        );

    const coins = [];

    for(const symbol of COINS){

        const currentPrice =
            await provider
            .getCurrentPrice(
                symbol
            );

        const heatmap1D =
            await heatmapProvider
            .getHeatmap(
                currentPrice
            );

        const heatmap2D =
            await heatmapProvider
            .getHeatmap(
                currentPrice
            );

        const oneD =
            analyzer.extract(
                heatmap1D,
                currentPrice
            );

        const twoD =
            analyzer.extract(
                heatmap2D,
                currentPrice
            );

        const strong =
            confluence.find(
                oneD,
                twoD
            );

        coins.push({

            symbol,
            price:currentPrice,
            oneD,
            twoD,
            strong

        });
    }

    render(coins);
}

function render(data){

    const ranking =
        new RankingEngine()
        .build(data);

    document
    .getElementById(
        "ranking"
    ).innerHTML =

    ranking.map((r,i)=>`

        <div class="rank-row">

            <div>
                ${i+1}. ${r.symbol}
            </div>

            <div>
                Price:
                ${r.price}
            </div>

            <div>
                Distance:
                ${r.distanceAbs}
            </div>

            <div>
                ${r.distancePct}%
            </div>

        </div>

    `).join("");

    document
    .getElementById(
        "coins"
    ).innerHTML =

    data.map(c=>`

    <div class="coin-card">

        <h2>${c.symbol}</h2>

        <div class="price">
            Current Price:
            ${c.price}
        </div>

        <div class="section">

            <h3>1D</h3>

            <b>Above</b>

            ${c.oneD.above.map(x=>`

                <div class="level">
                    ${x.price}
                    |
                    ${x.liquidity.toLocaleString()}
                </div>

            `).join("")}

            <br>

            <b>Below</b>

            ${c.oneD.below.map(x=>`

                <div class="level">
                    ${x.price}
                    |
                    ${x.liquidity.toLocaleString()}
                </div>

            `).join("")}

        </div>

        <div class="section">

            <h3>2D</h3>

            <b>Above</b>

            ${c.twoD.above.map(x=>`

                <div class="level">
                    ${x.price}
                    |
                    ${x.liquidity.toLocaleString()}
                </div>

            `).join("")}

            <br>

            <b>Below</b>

            ${c.twoD.below.map(x=>`

                <div class="level">
                    ${x.price}
                    |
                    ${x.liquidity.toLocaleString()}
                </div>

            `).join("")}

        </div>

        <div class="section">

            <div class="strong">
                STRONG LEVELS
            </div>

            <br>

            <b>Above</b>

            ${c.strong.above.map(x=>`

                <div>
                    ${x.price}
                </div>

            `).join("")}

            <br>

            <b>Below</b>

            ${c.strong.below.map(x=>`

                <div>
                    ${x.price}
                </div>

            `).join("")}

        </div>

    </div>

    `).join("");
}

document
.getElementById("tolerance")
.addEventListener(
    "input",
    e=>{
        document
        .getElementById(
            "tolText"
        ).innerText =
        e.target.value + "%";

        loadData();
    }
);

loadData();

setInterval(
    loadData,
    300000
);

</script>

</body>
</html>
